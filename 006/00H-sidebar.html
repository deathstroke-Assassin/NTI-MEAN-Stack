<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Social Sidebar</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;

        background:
          radial-gradient(circle at 80% 20%, #182b59, transparent 35%),
          radial-gradient(circle at 70% 80%, #101f46, transparent 40%),
          #080d1c;
      }

      /* =========================
         SIDEBAR TRIGGER
      ========================= */

      .sidebar-trigger {
        position: fixed;

        left: 0;
        top: 0;

        width: 35px;
        height: 100vh;

        z-index: 20;
      }

      /* =========================
         SIDEBAR
      ========================= */

      .social-sidebar {
        position: fixed;

        top: 50%;
        left: 25px;

        transform: translate(-120px, -50%);

        height: 70vh;
        max-height: 700px;
        min-height: 500px;

        width: 85px;

        padding: 18px 10px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;

        background: rgba(15, 23, 50, 0.7);

        border: 1px solid rgba(100, 120, 255, 0.6);

        border-radius: 45px;

        backdrop-filter: blur(15px);

        box-shadow:
          0 0 15px rgba(70, 90, 255, 0.5),
          inset 0 0 20px rgba(80, 90, 255, 0.1);

        z-index: 21;

        opacity: 0;

        transition:
          transform 0.35s ease,
          opacity 0.25s ease;
      }

      .social-sidebar.show {
        transform: translate(0, -50%);
        opacity: 1;
      }

      /* =========================
         SOCIAL ITEMS
      ========================= */

      .social-item {
        position: relative;

        width: 55px;
        height: 55px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        color: white;

        font-size: 23px;

        cursor: pointer;

        text-decoration: none;

        transition:
          transform 0.3s,
          box-shadow 0.3s,
          background 0.3s;
      }

      .social-item:hover {
        transform: scale(1.15);

        box-shadow:
          0 0 20px rgba(100, 120, 255, 0.8);
      }

      /* =========================
         COLORS
      ========================= */

      .discord {
        background: #5865f2;
      }

      .facebook {
        background: #1877f2;
      }

      .instagram {
        background: linear-gradient(
          45deg,
          #feda75,
          #fa7e1e,
          #d62976,
          #962fbf,
          #4f5bd5
        );
      }

      .youtube {
        background: #ff0000;
      }

      .x {
        background: #101010;
      }

      .tiktok {
        background: #111;
      }

      .reddit {
        background: #ff4500;
      }

      .github {
        background: #171515;
      }

      .linkedin {
        background: #0a66c2;
      }

      /* =========================
         TOOLTIP
      ========================= */

      .tooltip {
        position: absolute;

        left: 70px;

        padding: 10px 18px;

        color: white;

        background: rgba(20, 22, 40, 0.95);

        border: 1px solid #9c4dff;

        border-radius: 10px;

        white-space: nowrap;

        opacity: 0;

        pointer-events: none;

        transform: translateX(-10px);

        transition: 0.3s;

        font-size: 15px;

        box-shadow:
          0 0 15px rgba(160, 70, 255, 0.4);
      }

      .tooltip::before {
        content: "";

        position: absolute;

        left: -7px;
        top: 50%;

        width: 14px;
        height: 14px;

        transform: translateY(-50%) rotate(45deg);

        background: rgba(20, 22, 40, 0.95);

        border-left: 1px solid #9c4dff;
        border-bottom: 1px solid #9c4dff;
      }

      .social-item:hover .tooltip {
        opacity: 1;

        transform: translateX(0);
      }

      /* =========================
         DIVIDER
      ========================= */

      .divider {
        width: 45px;
        height: 1px;

        background: rgba(255, 255, 255, 0.2);

        margin: 4px 0;
      }

      /* =========================
         SHARE
      ========================= */

      .share-button {
        width: 55px;
        height: 55px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        color: white;

        background: rgba(80, 85, 130, 0.5);

        border: 1px solid rgba(150, 160, 255, 0.3);

        cursor: pointer;

        font-size: 20px;

        transition: 0.3s;

        position: relative;
      }

      .share-button:hover {
        transform: scale(1.15);

        box-shadow:
          0 0 20px rgba(120, 120, 255, 0.8);
      }

      .share-button .tooltip {
        left: 70px;
      }
    </style>
  </head>

  <body>

    <div class="sidebar-trigger"></div>

    <div class="social-sidebar" id="socialSidebar">

      <!-- Discord -->
      <a
        class="social-item discord"
        href="https://discord.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-discord"></i>
        <span class="tooltip">Discord</span>
      </a>

      <!-- Facebook -->
      <a
        class="social-item facebook"
        href="https://www.facebook.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-facebook-f"></i>
        <span class="tooltip">Facebook</span>
      </a>

      <!-- Instagram -->
      <a
        class="social-item instagram"
        href="https://www.instagram.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-instagram"></i>
        <span class="tooltip">Instagram</span>
      </a>

      <!-- YouTube -->
      <a
        class="social-item youtube"
        href="https://www.youtube.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-youtube"></i>
        <span class="tooltip">YouTube</span>
      </a>

      <!-- X -->
      <a
        class="social-item x"
        href="https://x.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-x-twitter"></i>
        <span class="tooltip">X</span>
      </a>

      <!-- TikTok -->
      <a
        class="social-item tiktok"
        href="https://www.tiktok.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-tiktok"></i>
        <span class="tooltip">TikTok</span>
      </a>

      <!-- Reddit -->
      <a
        class="social-item reddit"
        href="https://www.reddit.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-reddit-alien"></i>
        <span class="tooltip">Reddit</span>
      </a>

      <!-- GitHub -->
      <a
        class="social-item github"
        href="https://github.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-github"></i>
        <span class="tooltip">GitHub</span>
      </a>

      <!-- LinkedIn -->
      <a
        class="social-item linkedin"
        href="https://www.linkedin.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-linkedin-in"></i>
        <span class="tooltip">LinkedIn</span>
      </a>

      <div class="divider"></div>

      <!-- Share -->
      <div class="share-button" id="shareButton">
        <i class="fa-solid fa-share-nodes"></i>
        <span class="tooltip">Share</span>
      </div>

    </div>


    <script>
      const sidebar = document.getElementById("socialSidebar");
      const trigger = document.querySelector(".sidebar-trigger");

      let hideTimeout;

      function showSidebar() {
        clearTimeout(hideTimeout);

        sidebar.classList.add("show");
      }

      function hideSidebar() {
        hideTimeout = setTimeout(() => {
          sidebar.classList.remove("show");
        }, 200);
      }

      trigger.addEventListener("mouseenter", showSidebar);
      trigger.addEventListener("mouseleave", hideSidebar);

      sidebar.addEventListener("mouseenter", showSidebar);
      sidebar.addEventListener("mouseleave", hideSidebar);


      /* =========================
         SHARE BUTTON
      ========================= */

      const shareButton = document.getElementById("shareButton");

      shareButton.addEventListener("click", async () => {

        if (navigator.share) {

          try {

            await navigator.share({
              title: document.title,
              text: "Check this out!",
              url: window.location.href
            });

          } catch (error) {

            console.log("Share cancelled");

          }

        } else {

          navigator.clipboard.writeText(window.location.href);

          alert("Link copied!");

        }
      });
    </script>

  </body>
</html>
