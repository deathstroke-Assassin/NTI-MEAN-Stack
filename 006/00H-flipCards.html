<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flip Cards</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #1e3a5f 0%,
                    #0f172a 45%,
                    #020617 100%
                );

            color: white;

            padding: 50px 20px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 10px;
        }

        .header p {
            color: #94a3b8;
        }


        /* =========================
           CARDS
        ========================= */

        .cards-container {
            max-width: 1200px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));

            gap: 30px;

            justify-items: center;
        }


        .card {
            width: 100%;
            max-width: 300px;
            height: 400px;

            perspective: 1400px;
        }


        .card-inner {
            position: relative;

            width: 100%;
            height: 100%;

            transform-style: preserve-3d;

            transition:
                transform .85s cubic-bezier(
                    .4,
                    .2,
                    .2,
                    1
                );
        }


        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }


        /* =========================
           FACES
        ========================= */

        .card-face {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border-radius: 20px;

            overflow: hidden;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            box-shadow:
                0 20px 50px rgba(
                    0,
                    0,
                    0,
                    .4
                );

            background: #1e293b;
        }


        /* =========================
           FRONT
        ========================= */

        .card-front {
            cursor: pointer;
        }


        .card-front img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition:
                transform .7s ease;
        }


        .card-front:hover img {
            transform: scale(1.06);
        }


        .front-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, .9),
                    rgba(0, 0, 0, 0) 65%
                );
        }


        .front-content {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding: 25px;

            z-index: 2;
        }


        .front-content h2 {
            font-size: 1.5rem;
            margin-bottom: 7px;
        }


        .front-content span {
            color: #cbd5e1;
            font-size: .85rem;
        }


        /* =========================
           BACK
        ========================= */

        .card-back {
            transform: rotateY(180deg);

            padding: 0;

            background:
                linear-gradient(
                    145deg,
                    #1e293b,
                    #0f172a
                );
        }


        /*
         * THIS is the important part.
         *
         * The back face is rotated,
         * but its inner content gets
         * its own normal interaction layer.
         */

        .back-content {
            width: 100%;
            height: 100%;

            padding: 30px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: flex-start;

            cursor: pointer;
        }


        .back-content h2 {
            font-size: 1.7rem;

            margin-bottom: 15px;
        }


        .back-content p {
            color: #cbd5e1;

            font-size: .95rem;

            line-height: 1.7;

            margin-bottom: 25px;

            display: -webkit-box;

            -webkit-box-orient: vertical;

            -webkit-line-clamp: 6;

            overflow: hidden;
        }


        /* =========================
           READ MORE
        ========================= */

        .read-more {
            display: inline-block;

            position: relative;

            border: none;
            outline: none;

            padding: 12px 22px;

            border-radius: 30px;

            background: #38bdf8;

            color: #082f49;

            font-size: .95rem;

            font-weight: bold;

            cursor: pointer;

            /*
             * Don't let the button inherit
             * anything weird from the 3D card.
             */

            transform: translateZ(1px);


        }


        .read-more:hover {

            background: #7dd3fc;

            box-shadow:
                0 8px 20px rgba(
                    56,
                    189,
                    248,
                    .25
                );
        }


        .read-more:active {
            transform:
                translateZ(1px)
                scale(.95);
        }


        /* =========================
           POPUP
        ========================= */

        .popup-overlay {
            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(
                    2,
                    6,
                    23,
                    .72
                );

            backdrop-filter: blur(5px);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .3s ease,
                visibility .3s ease;

            z-index: 1000;
        }


        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }


        .popup {
            width: 100%;
            max-width: 500px;

            max-height: 80vh;

            overflow-y: auto;

            padding: 32px;

            position: relative;

            background:
                linear-gradient(
                    145deg,
                    #1e293b,
                    #0f172a
                );

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .08
                );

            border-radius: 20px;

            box-shadow:
                0 25px 80px rgba(
                    0,
                    0,
                    0,
                    .6
                );

            transform:
                translateY(25px)
                scale(.9);

            transition:
                transform .35s
                cubic-bezier(
                    .4,
                    0,
                    .2,
                    1
                );
        }


        .popup-overlay.active .popup {
            transform:
                translateY(0)
                scale(1);
        }


        .popup h2 {
            font-size: 1.7rem;

            margin-bottom: 15px;

            padding-right: 35px;
        }


        .popup p {
            color: #cbd5e1;

            font-size: 1rem;

            line-height: 1.8;
        }


        /* =========================
           CLOSE
        ========================= */

        .close-popup {
            position: absolute;

            top: 15px;
            right: 15px;

            width: 35px;
            height: 35px;

            border: none;

            border-radius: 50%;

            background: #334155;

            color: white;

            font-size: 21px;

            cursor: pointer;

            transition:
                background .2s ease,
                transform .2s ease;
        }


        .close-popup:hover {
            background: #475569;

            transform: rotate(90deg);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }

            .cards-container {
                gap: 20px;
            }

            .card {
                max-width: 330px;
                height: 390px;
            }

            .popup {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <header class="header">

        <h1>
            Discover Something New
        </h1>

        <p>
            Click a card to flip it
        </p>

    </header>


    <main
        class="cards-container"
        id="cardsContainer"
    ></main>


    <!-- =========================
         POPUP
    ========================== -->

    <div
        class="popup-overlay"
        id="popupOverlay"
    >

        <div class="popup">

            <button
                class="close-popup"
                id="closePopup"
                type="button"
            >
                ×
            </button>

            <h2 id="popupTitle"></h2>

            <p id="popupDescription"></p>

        </div>

    </div>


    <script>

        /* =========================
           DATA
        ========================= */

        const cardsData = [

            {
                title: "Northern Lights",

                category: "Nature",

                image:
                    "https://images.unsplash.com/photo-1483347756197-71ef80e95f73?auto=format&fit=crop&w=900&q=85",

                description:
                    "The Northern Lights are one of nature's most spectacular phenomena. Charged particles from the Sun interact with gases in Earth's atmosphere, creating colorful waves of light across the night sky.",

                more:
                    "Auroras are most commonly visible near Earth's polar regions. Their intensity changes depending on solar activity. During powerful solar storms, auroras can sometimes become visible much farther from the polar regions."
            },


            {
                title: "Iceland",

                category: "Travel",

                image:
                    "https://images.unsplash.com/photo-1504829857797-ddff29c27927?auto=format&fit=crop&w=900&q=85",

                description:
                    "Iceland is famous for dramatic landscapes filled with volcanoes, glaciers, waterfalls, black-sand beaches, and geothermal springs.",

                more:
                    "Iceland sits on the Mid-Atlantic Ridge where tectonic plates are slowly moving apart. This geological activity contributes to its volcanoes, lava fields, geothermal springs, and other unusual landscapes."
            },


            {
                title: "Deep Ocean",

                category: "Science",

                image:
                    "https://images.unsplash.com/photo-1551244072-5d12893278ab?auto=format&fit=crop&w=900&q=85",

                description:
                    "The deep ocean remains one of Earth's least explored environments. Extreme pressure, darkness, and cold temperatures create a challenging environment for life.",

                more:
                    "Many deep-sea creatures have developed incredible adaptations, including bioluminescence, specialized feeding mechanisms, and bodies capable of surviving enormous pressure."
            },


            {
                title: "Tokyo Streets",

                category: "Travel",

                image:
                    "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=900&q=85",

                description:
                    "Tokyo combines futuristic technology with centuries-old traditions. The city is famous for its neighborhoods, food, transportation, temples, and vibrant urban culture.",

                more:
                    "Tokyo contains an enormous variety of neighborhoods. Some areas are filled with massive digital screens and nightlife, while others contain quiet temples, traditional houses, and peaceful gardens."
            },


            {
                title: "The Sahara",

                category: "Geography",

                image:
                    "https://images.unsplash.com/photo-1473580044384-7ba9967e16a0?auto=format&fit=crop&w=900&q=85",

                description:
                    "The Sahara is the world's largest hot desert. It stretches across much of North Africa and contains enormous sand dunes, rocky plateaus, dry valleys, and isolated oases.",

                more:
                    "Despite its extreme dryness, the Sahara supports many forms of life. Plants and animals have evolved specialized adaptations to survive with extremely limited access to water."
            },


            {
                title: "Space Exploration",

                category: "Technology",

                image:
                    "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=900&q=85",

                description:
                    "Human space exploration has transformed our understanding of the universe. Satellites, probes, telescopes, and crewed missions continue revealing information about space.",

                more:
                    "Modern astronomy combines robotic spacecraft, crewed missions, and increasingly powerful telescopes to study distant galaxies, stars, planets, and other objects throughout the universe."
            },


            {
                title: "Rainforest",

                category: "Wildlife",

                image:
                    "https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=85",

                description:
                    "Tropical rainforests contain enormous biodiversity. They provide habitats for countless plants, animals, insects, fungi, and microorganisms.",

                more:
                    "Rainforests play major roles in the global water and carbon cycles. Their dense vegetation provides habitats for an enormous variety of organisms."
            },


            {
                title: "Mountain Peaks",

                category: "Adventure",

                image:
                    "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85",

                description:
                    "Mountain environments are shaped by powerful geological forces and extreme weather conditions. They provide some of the world's most spectacular landscapes.",

                more:
                    "Mountains influence climate, rivers, ecosystems, and human settlements. Many major rivers begin as snow or ice in mountain regions and provide freshwater to millions of people."
            }

        ];


        /* =========================
           ELEMENTS
        ========================= */

        const cardsContainer =
            document.getElementById(
                "cardsContainer"
            );

        const popupOverlay =
            document.getElementById(
                "popupOverlay"
            );

        const popupTitle =
            document.getElementById(
                "popupTitle"
            );

        const popupDescription =
            document.getElementById(
                "popupDescription"
            );

        const closePopup =
            document.getElementById(
                "closePopup"
            );


        /* =========================
           SHUFFLE
        ========================= */

        function shuffle(array) {

            const shuffled = [...array];

            for (
                let i = shuffled.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );

                [
                    shuffled[i],
                    shuffled[j]
                ] =
                [
                    shuffled[j],
                    shuffled[i]
                ];
            }

            return shuffled;
        }


        /* =========================
           CREATE CARDS
        ========================= */

        function createCards() {

            const shuffledCards =
                shuffle(cardsData);


            shuffledCards.forEach(data => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className = "card";


                card.innerHTML = `

                    <div class="card-inner">

                        <!-- FRONT -->

                        <div class="
                            card-face
                            card-front
                        ">

                            <img
                                src="${data.image}"
                                alt="${data.title}"
                            >

                            <div class="
                                front-overlay
                            "></div>

                            <div class="
                                front-content
                            ">

                                <h2>
                                    ${data.title}
                                </h2>

                                <span>
                                    ${data.category}
                                </span>

                            </div>

                        </div>


                        <!-- BACK -->

                        <div class="
                            card-face
                            card-back
                        ">

                            <div class="
                                back-content
                            ">

                                <h2>
                                    ${data.title}
                                </h2>

                                <p>
                                    ${data.description}
                                </p>

                                <button
                                    class="read-more"
                                    type="button"
                                >
                                    Read More
                                </button>

                            </div>

                        </div>

                    </div>

                `;


                const front =
                    card.querySelector(
                        ".card-front"
                    );

                const backContent =
                    card.querySelector(
                        ".back-content"
                    );

                const readMore =
                    card.querySelector(
                        ".read-more"
                    );


                /* FRONT -> BACK */

                front.addEventListener(
                    "click",
                    () => {

                        card.classList.add(
                            "flipped"
                        );

                    }
                );


                /* BACK -> FRONT */

                backContent.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target.closest(
                                ".read-more"
                            )
                        ) {
                            return;
                        }

                        card.classList.remove(
                            "flipped"
                        );

                    }
                );


                /* READ MORE */

                readMore.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();

                        event.stopPropagation();

                        popupTitle.textContent =
                            data.title;

                        popupDescription.textContent =
                            data.more;

                        popupOverlay.classList.add(
                            "active"
                        );

                    }
                );


                cardsContainer.appendChild(
                    card
                );

            });

        }


        /* =========================
           CLOSE POPUP
        ========================= */

        function closePopupWindow() {

            popupOverlay.classList.remove(
                "active"
            );

        }


        closePopup.addEventListener(
            "click",
            closePopupWindow
        );


        /* CLICK OUTSIDE */

        popupOverlay.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    popupOverlay
                ) {

                    closePopupWindow();

                }

            }
        );


        /* ESCAPE */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closePopupWindow();

                }

            }
        );


        /* START */

        createCards();

    </script>

</body>

</html>
