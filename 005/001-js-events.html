    <script>
      function formSubmit(event) {
        event.preventDefault(); // prevents the default submit behavior
        allAreValid = true;
        username = document.querySelector("#userName1");
        password = document.querySelector("#password");

        //   if (emailPattern.test(username.value)) {
        //     console.log("good email");
        //   } else {
        //     console.log("bad email");
        //   }
        passwordPattern= /.{8,}/ //  dot .  works for all symbols 
        // {8,} 8 or more
        emailPattern = /^([a-zA-Z]{1,9})[@]{1}([a-zA-Z]{1,8}[.][a-zA-Z]{3})$/;
        if (!emailPattern.test(username.value)) {
          allAreValid = false;
          document.querySelector("#userName1").style.backgroundColor = "red";
          console.log("username is Incorrect");
        }
        if (!(passwordPattern.test(password.value))) {
        // if (!(password.value.length >= 8)) {
          // use () with not always (!)
          // this is wrong => !condition
          // this is correct => !(condition)
          allAreValid = false;
          document.querySelector("#password").style.backgroundColor = "red";
          console.log("password too short, must be more than 8");
        }
        if (allAreValid) {
          document.querySelector("#myForm").submit(); //submits after validation
          console.log("data validated");
        }
      }
