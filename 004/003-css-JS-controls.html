<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="t1">title</h1>
    <button onclick="changeFormat()">click to change format</button>
    <button onclick="removeClassStyle()">click to remove ClassStyle</button>
    <script>
        function changeFormat() {
            // document.querySelector("#t1").style.color= "red";
            // document.querySelector("#t1").style.backgroundColor= "yellow";
            document.querySelector("#t1").classList.add("mytitleStyle")
        }
        function removeClassStyle() {
            document.querySelector("#t1").classList.remove("mytitleStyle")
        }
    </script>
    <style>
        .mytitleStyle {
            text-decoration: overline;
            color:brown;
        }
    </style>
</body>
</html>
